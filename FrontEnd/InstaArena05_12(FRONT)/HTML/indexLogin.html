<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/CSS/Login.css">
    <link rel="icon" href="/imagens/Logo.png">
</head>
<body class="login">
    <form>
        <img class="logo" src="/imagens/InstaArena.png">  
        <fieldset>
            <h1>LOGIN:</h1>
             <p>Entre com seus dados:</p>
            <input type="text" placeholder="Usuário" name="nome"><br>
            <input type="email" placeholder="E-mail" name="email" id="email"><br>
            <input type="password" placeholder="Senha" name="senha" id="senha"><br>
            <div id="mensagem2"></div>
            <input class="enviar" type="button" value="Entrar" id="logar">
            <a href="cadastro.html"><br>
            <input class="cadastro" type="button" value="Cadastre-se"></a>
       
        </fieldset>
    </form>
    <footer><h2>&copy; 2025 - Garagem Boys</h2></footer>
<script src="/JAVASCRIPT/Login.js"></script></body>
</html>
