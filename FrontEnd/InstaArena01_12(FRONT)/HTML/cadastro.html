<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/Login.css">
    <title>Cadastro</title>
</head>
<body class="login">
    <form>
        <img class="logo" src="/imagens/InstaArena.png">  
        <fieldset>
            <h1>Cadastro</h1>
           <p>Crie sua conta:</p>
            <input type="text" placeholder="Usuário" name="nome" id="usuario"><br>
            <input type="email" placeholder="E-mail" name="email" id="email"><br>
            <input type="password" placeholder="Senha" name="senha" id="senha"><br>
            <div id="mensagem"></div>
            <input class="enviar" type="button" value="Criar Conta" id="button">
        
        </fieldset>
    </form>
<script src="/JAVASCRIPT/cadastro.js"></script></body>
</html>
